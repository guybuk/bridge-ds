# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Pytests

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        dependencies: [ { "extras": [], "test_dir": "core" },{ "extras": ["vision"], "test_dir": "vision" } ]

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
    - name: Install dependencies
      shell: bash
      run: |
        # Parse extras from matrix into a bash array
        extras_json='${{ toJson(matrix.dependencies.extras) }}'
        extras=$(echo "$extras_json" | jq -r '.[]')

        # Build uv sync command with all extras````````````
        cmd="uv sync --locked"
        for extra in $extras; do
          cmd="$cmd --extra $extra"
        done

        echo "Running: $cmd"
        eval $cmd
    - name: Cache downloaded notebook test data
      if: matrix.dependencies.test_dir == 'vision'
      uses: actions/cache@v4
      with:
        path: |
          /tmp/bridge-ds/tutorials/coco
          /tmp/bridge-ds/tutorials/imdb
        key: notebook-data-v1
    - name: Test with pytest
      run: |
        uv run pytest tests/${{ matrix.dependencies.test_dir }} -m "slow or not slow"
