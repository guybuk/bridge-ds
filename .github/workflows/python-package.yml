# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        dependencies: [ { "extras": [], "test_dir": "core" },{ "extras": ["vision"], "test_dir": "vision" } ]

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
    - uses: actions/checkout@v3
    - name: Install dependencies
      shell: bash
      run: |
        # Install uv and add to PATH
        curl -LsSf https://astral.sh/uv/install.sh | sh
        source $HOME/.local/bin/env

        # Parse extras from matrix into a bash array
        extras_json='${{ toJson(matrix.dependencies.extras) }}'
        extras=$(echo "$extras_json" | jq -r '.[]')

        # Build uv sync command with all extras
        cmd="uv sync"
        for extra in $extras; do
          cmd="$cmd --extra $extra"
        done

        echo "Running: $cmd"
        eval $cmd
    - name: Test with pytest
      run: |
        source .venv/bin/activate
        python -m pytest tests/${{ matrix.dependencies.test_dir }}
