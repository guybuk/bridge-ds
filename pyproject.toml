[project]
name = "bridge-ds"
version = "0.1.2"
description = "A Bridge to Datasets!"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "tqdm>=4.60",
]
[project.optional-dependencies]
vision = [
    "scikit-image>=0.21",
    "pillow>=10.0",
    "holoviews>=1.17",
    "panel>=1.3",
    "hvplot>=0.9",
    "tabulate>=0.9",
    "jupyter_bokeh>=4.0",
]

[tool.setuptools.packages.find]
exclude = ["tests", "notebooks"]


[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "notebook>=7.4.5",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "pytest",
    "pytest-mock",
    "pre-commit",
    "ipykernel",
    "testbook",
    "sphinx",
    "nbsphinx",
    "pycocotools>=2.0.10",
    "pydata-sphinx-theme>=0.16.1",
]

[tool.uv.build-backend]
module-name = "bridge"
module-root = "."

[tool.pytest.ini_options]
markers = [
    "slow: opt-in slow tests (notebook integration); run with `pytest -m slow` or `pytest -m 'slow or not slow'`",
]
addopts = "-m 'not slow'"
